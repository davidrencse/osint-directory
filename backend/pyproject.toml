[project]
name = "osint-dashboard"
version = "0.1.0"
description = "Infrastructure OSINT recon, live world map, file metadata and tool launcher"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "dnspython>=2.7",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "pypdf>=5.1",
    "hachoir>=3.3",
    "websockets>=13.0",
    "cryptography>=50.0.1",
    "tldextract>=5.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
